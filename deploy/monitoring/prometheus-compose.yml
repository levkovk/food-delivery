global:
  scrape_interval: 10s
scrape_configs:
  - job_name: food-delivery
    static_configs:
      - targets:
          - gateway:8080
          - order-service:8080
          - restaurant-service:8080
          - payment-service:8080
          - courier-service:8080
          - notification-service:8080
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: app
