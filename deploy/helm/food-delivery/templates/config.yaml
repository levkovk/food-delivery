apiVersion: v1
kind: ConfigMap
metadata:
  name: food-delivery-config
  labels:
    {{- include "fd.labels" . | nindent 4 }}
data:
  DB_HOST: postgres
  DB_NAME: food
  KAFKA_BROKERS: kafka-0.kafka:9092
  KAFKA_PARTITIONS: {{ .Values.kafka.partitions | quote }}
  KAFKA_REPLICATION: "1"
  TIME_SCALE: {{ .Values.timeScale | quote }}
  LOG_LEVEL: info
---
# Ограничения по умолчанию для контейнеров без явных ресурсов.
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 256Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
