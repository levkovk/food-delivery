apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "fd.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
    tier: edge
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "fd.labels" . | nindent 8 }}
        app.kubernetes.io/name: web
        tier: edge
    spec:
      {{- include "fd.pullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      tolerations:
        {{- include "fd.tolerations" . | nindent 8 }}
      containers:
        - name: nginx
          image: {{ include "fd.image" (list . "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "fd.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Единая точка входа: статика панели и API на одном адресе.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery
  labels:
    {{- include "fd.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 8080 }
