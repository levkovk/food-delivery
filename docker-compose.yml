# Локальная среда разработки: все сервисы на одной машине.
# Запуск: cp .env.example .env && docker compose up -d --build
name: food-delivery

x-go-service: &go-service
  restart: unless-stopped
  environment: &go-env
    DB_HOST: postgres
    DB_NAME: food
    KAFKA_BROKERS: kafka:9092
    TIME_SCALE: "1"
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  networks: [backend, data]
  read_only: true
  security_opt: ["no-new-privileges:true"]
  deploy:
    resources:
      limits: { cpus: "0.50", memory: 128M }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: food
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/10-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [data]

  gateway:
    <<: *go-service
    build: { context: ., args: { SERVICE: gateway } }
    image: food-delivery/gateway:local
    environment:
      <<: *go-env
      DB_USER: gateway
      DB_SCHEMA: gateway
      DB_PASSWORD: ${GATEWAY_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [frontend, backend, data]

  order-service:
    <<: *go-service
    build: { context: ., args: { SERVICE: order } }
    image: food-delivery/order:local
    environment:
      <<: *go-env
      DB_USER: orders
      DB_SCHEMA: orders
      DB_PASSWORD: ${ORDER_DB_PASSWORD}

  restaurant-service:
    <<: *go-service
    build: { context: ., args: { SERVICE: restaurant } }
    image: food-delivery/restaurant:local
    environment:
      <<: *go-env
      DB_USER: restaurants
      DB_SCHEMA: restaurants
      DB_PASSWORD: ${RESTAURANT_DB_PASSWORD}

  payment-service:
    <<: *go-service
    build: { context: ., args: { SERVICE: payment } }
    image: food-delivery/payment:local
    environment:
      <<: *go-env
      DB_USER: payments
      DB_SCHEMA: payments
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}

  courier-service:
    <<: *go-service
    build: { context: ., args: { SERVICE: courier } }
    image: food-delivery/courier:local
    environment:
      <<: *go-env
      DB_USER: couriers
      DB_SCHEMA: couriers
      DB_PASSWORD: ${COURIER_DB_PASSWORD}

  notification-service:
    <<: *go-service
    build: { context: ., args: { SERVICE: notification } }
    image: food-delivery/notification:local
    depends_on:
      kafka:
        condition: service_healthy

  loadgen:
    <<: *go-service
    build: { context: ., args: { SERVICE: loadgen } }
    image: food-delivery/loadgen:local
    environment:
      GATEWAY_URL: http://gateway:8080
      LOADGEN_PASSWORD: ${OPERATOR_PASSWORD}
      ORDERS_PER_BATCH: "3"
      INTERVAL_SECONDS: "20"
    depends_on: [gateway]
    networks: [frontend]
    profiles: [load]

  web:
    build: ./web
    image: food-delivery/web:local
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on: [gateway]
    networks: [frontend]

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [backend, frontend]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [backend]

networks:
  # Внешний контур: веб-сервер и шлюз.
  frontend: {}
  # Прикладной контур: шлюз и сервисы.
  backend: {}
  # Контур данных без выхода наружу: PostgreSQL и Kafka.
  data:
    internal: true

volumes:
  pgdata: {}
  kafkadata: {}
