name: Демонстрация

# Прогон для снимков экрана к отчёту. Снимки публикуются в ветку screens.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
      - name: Инструменты
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xterm xdotool imagemagick fonts-liberation
          curl -sSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.5 bash
          pip install -q playwright==1.49.1
          playwright install --with-deps chromium
      - name: Запись
        run: xvfb-run -a -s '-screen 0 2200x1600x24' demo/record.sh
      - name: Страница последнего запуска CI/CD
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow ci-cd.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN" ] && python demo/browser.py page "https://github.com/${GITHUB_REPOSITORY}/actions/runs/$RUN" demo/out/actions.png || true
      - name: Диагностика
        if: failure()
        run: |
          kubectl -n food get pods -o wide || true
          kubectl -n food get events --sort-by=.lastTimestamp | tail -30 || true
      - name: Публикация снимков
        if: always()
        run: |
          mkdir -p /tmp/screens && cp -r demo/out/. /tmp/screens/ || true
          cd /tmp/screens && git init -q -b screens
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -A && git commit -qm "Снимки прогона ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screens
